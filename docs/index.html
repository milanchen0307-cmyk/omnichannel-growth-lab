<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全渠道增长工作台 · Growth Lab</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><a class="brand" href="https://milanchen0307-cmyk.github.io/analytics-portfolio/">ANALYTICS / <b>GROWTH LAB</b></a><div><span class="badge" data-zh="模拟数据演示" data-en="SYNTHETIC DATA"></span><button id="language" aria-label="Switch language">English</button></div></header>
<div class="shell"><aside><div class="eyebrow" data-zh="客户筛选" data-en="AUDIENCE FILTERS"></div><p class="muted" data-zh="从客户信号到可执行的触达名单。" data-en="From customer signals to an actionable contact list."></p>
<label for="segment" data-zh="客户分群" data-en="Customer segment"></label><select id="segment"><option value="" data-zh="全部分群" data-en="All segments"></option><option value="loyal" data-zh="稳定复购" data-en="Repeat shoppers"></option><option value="exploring" data-zh="数字探索" data-en="Digital explorers"></option><option value="dormant" data-zh="待唤回" data-en="Reactivation"></option></select>
<label for="region" data-zh="地区" data-en="Region"></label><select id="region"><option value="" data-zh="全部地区" data-en="All regions"></option><option value="north" data-zh="北区" data-en="North"></option><option value="central" data-zh="中区" data-en="Central"></option><option value="south" data-zh="南区" data-en="South"></option></select>
<label for="channel" data-zh="偏好渠道" data-en="Preferred channel"></label><select id="channel"><option value="" data-zh="全部渠道" data-en="All channels"></option><option value="email" data-zh="邮件" data-en="Email"></option><option value="sms" data-zh="短信" data-en="SMS"></option><option value="app" data-zh="App 推送" data-en="App push"></option></select>
<label for="minimum"><span data-zh="最低优先级分" data-en="Minimum priority"></span><output id="minval">0</output></label><input id="minimum" type="range" min="0" max="100" value="0"><div class="range-label"><span>0</span><span>100</span></div><button id="reset" class="secondary" data-zh="重置筛选" data-en="Reset filters"></button>
<div class="aside-note"><b data-zh="关于这份演示" data-en="ABOUT THIS DEMO"></b><p data-zh="1,200 位独立生成的虚构客户。评分规则与预算参数用于演示分析流程。" data-en="1,200 independently generated fictional customers. Scoring and budget assumptions illustrate the analytical workflow."></p><a href="https://github.com/milanchen0307-cmyk/omnichannel-growth-lab" data-zh="查看代码与方法 ↗" data-en="Code & methodology ↗"></a></div></aside>
<main><div class="title-row"><div><div class="eyebrow" data-zh="全渠道 · 增长决策" data-en="OMNICHANNEL · GROWTH DECISIONS"></div><h1 data-zh="把客户信号变成行动" data-en="Turn customer signals into action"></h1><p class="muted" data-zh="选对人，找到触达时机，再用小规模试点验证。" data-en="Choose an audience, find a contact window, then test with a focused pilot."></p></div><span class="edition">LAB / 05</span></div>
<nav class="tabs" aria-label="Views"><button class="active" data-view="audience" data-zh="01 客户机会" data-en="01 Audience"></button><button data-view="pilot" data-zh="02 试点规划" data-en="02 Pilot planner"></button><button data-view="method" data-zh="03 项目方法" data-en="03 Method"></button></nav>
<div id="status" role="status" class="status"></div>
<section id="audience" class="view"><div class="metrics" id="metrics"></div><div class="analysis-grid"><section class="panel"><div class="panel-head"><h2 data-zh="哪些客户更值得关注？" data-en="Which customers deserve attention?"></h2><button id="export" data-zh="导出名单 ↓" data-en="Export list ↓"></button></div><p class="caption" data-zh="按优先级降序 · 展示前 12 位 · 点击客户查看原因" data-en="Highest priority first · Top 12 · Select a customer to inspect the rationale"></p><div id="detail" class="detail"></div><div class="table-scroll"><table><thead><tr><th data-zh="客户" data-en="Customer"></th><th data-zh="优先级" data-en="Priority"></th><th data-zh="渠道" data-en="Channel"></th><th data-zh="许可" data-en="Consent"></th></tr></thead><tbody id="customers"></tbody></table></div></section>
<div><section class="panel"><h2 data-zh="渠道覆盖" data-en="Channel coverage"></h2><p class="caption" data-zh="深色为有触达许可，浅色为未授权；每位客户仅一个偏好渠道。" data-en="Dark: consented. Light: no consent. One preferred channel per customer."></p><div id="channels"></div></section><section class="panel timing"><h2 data-zh="客户偏好时段分布" data-en="Preferred contact windows"></h2><p class="caption" data-zh="客户偏好时段分布 · 深色代表人数较多" data-en="Preferred activity windows · Darker means more customers"></p><div id="heatmap"></div><p class="caption" data-zh="用于选择测试窗口，不代表消息响应率。" data-en="A guide for test windows, not message response rates."></p></section></div></div></section>
<section id="pilot" class="view" hidden><div class="pilot-layout"><section class="panel"><div class="eyebrow" data-zh="规划输入" data-en="PLANNING INPUTS"></div><h2 data-zh="把机会变成一场可验证的试点" data-en="Build a testable pilot"></h2><p class="muted" data-zh="沿用左侧筛选，仅纳入有触达许可的客户。" data-en="Uses the current filters and includes only consented customers."></p><label for="budget"><span data-zh="预算上限（演示单位）" data-en="Budget cap (demo units)"></span><output id="budgetval"></output></label><input type="range" id="budget" min="0" max="300" step="5" value="100"><label for="capacity"><span data-zh="可触达人数上限" data-en="Contact capacity"></span><output id="capacityval"></output></label><input type="range" id="capacity" min="0" max="1000" step="10" value="200"><label for="response"><span data-zh="假设响应率区间 (%)" data-en="Assumed response range (%)"></span></label><div class="numbers"><input aria-label="Lower response percent" id="low" type="number" min="0" max="100" value="3"><span>—</span><input aria-label="Upper response percent" id="high" type="number" min="0" max="100" value="7"></div><p class="caption" data-zh="假设触达单价：邮件 0.2 / 短信 0.5 / App 0.1。响应率由你设定，不是模型预测。" data-en="Assumed unit costs: email 0.2 / SMS 0.5 / app 0.1. Response rates are your assumptions, not predictions."></p></section><section class="panel scenario"><div class="eyebrow" data-zh="情景估算 · 未实际投放" data-en="SCENARIO · NOT A LIVE CAMPAIGN"></div><div id="plan"></div><button id="export-pilot" data-zh="导出试点名单 ↓" data-en="Export pilot list ↓"></button><hr><h3 data-zh="下一步：验证增量效果" data-en="Next: measure incremental impact"></h3><p data-zh="正式试点需先从合格人群中随机划分触达组与不触达对照组，提前确定观察窗口和转化口径，再比较两组结果。这里展示的是预算可行性，并未执行实验。" data-en="For a live pilot, randomly assign eligible customers to contact and holdout groups. Define the observation window and conversion metric before comparing results. This planner shows budget feasibility; it does not run an experiment."></p></section></div></section>
<section id="method" class="view" hidden><section class="panel method"><div class="eyebrow" data-zh="案例背景" data-en="CASE CONTEXT"></div><h2 data-zh="从“推动线上采用”拆解到五个决策" data-en="Five decisions behind digital adoption"></h2><p data-zh="本作品源于企业合作课程项目的全渠道增长分析思路：整合客户行为与交易信号，将宽泛的增长问题拆为人群、时机、内容、渠道与执行方式。公开版独立重建了演示流程，不包含企业原始记录或内部结果。" data-en="This portfolio piece draws on an industry-sponsored capstone approach: combine customer behavior and transaction signals, then translate a broad adoption goal into audience, timing, content, channel and execution decisions. This public demo is independently rebuilt, without company records or internal results."></p><div id="steps"></div><h3 data-zh="公开演示的评分规则" data-en="Scoring in this public demo"></h3><p class="formula">Priority = 0.4 × Recency + 0.3 × Frequency + 0.3 × Digital readiness</p><p data-zh="三个维度均归一化到 0–100。这里的规则和权重为演示重新设定，不是原项目模型；评分用于排序，不是转化概率。完整字段定义、公式和运行方式见仓库 README。" data-en="All components are normalized to 0–100. These rules and weights were created for this demo, not copied from the original model. The score ranks customers; it is not a conversion probability. See the repository README for formulas, fields and reproduction steps."></p></section></section>
<footer><span data-zh="全渠道增长分析 · 公开作品集演示" data-en="Omnichannel growth · Public portfolio demo"></span><span>PYTHON / JAVASCRIPT / SYNTHETIC DATA</span></footer></main></div><script src="engine.js"></script><script src="app.js"></script></body></html>
